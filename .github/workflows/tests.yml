name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 10 → Testbench 8.x (PHP 8.1, 8.2)
          - php: "8.2"
            laravel: "10"
            testbench: "^8.0"
            phpunit: "^10.5"
          # Laravel 11 → Testbench 9.x (PHP 8.2, 8.3)
          - php: "8.2"
            laravel: "11"
            testbench: "^9.0"
            phpunit: "^10.5"
          - php: "8.3"
            laravel: "11"
            testbench: "^9.0"
            phpunit: "^10.5"
          # Laravel 12 → Testbench 10.x (PHP 8.2, 8.3, 8.4)
          - php: "8.2"
            laravel: "12"
            testbench: "^10.0"
            phpunit: "^11.5"
          - php: "8.3"
            laravel: "12"
            testbench: "^10.0"
            phpunit: "^11.5"
          - php: "8.4"
            laravel: "12"
            testbench: "^10.0"
            phpunit: "^11.5"
          # Laravel 13 → Testbench 11.x (PHP 8.3, 8.4)
          - php: "8.3"
            laravel: "13"
            testbench: "^11.0"
            phpunit: "^11.5"
          - php: "8.4"
            laravel: "13"
            testbench: "^11.0"
            phpunit: "^11.5"

    name: PHP ${{ matrix.php }} | Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, json
          coverage: none

      - name: Remove lock file
        run: rm -f composer.lock

      - name: Install dependencies
        run: |
          composer remove --dev orchestra/testbench phpunit/phpunit --no-interaction
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" "illuminate/support:^${{ matrix.laravel }}" --no-interaction --no-progress --prefer-stable -W

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite=Unit

      - name: Run integration tests
        env:
          CASHBILL_MODE: dev
          CASHBILL_SHOP_ID: ${{ secrets.CASHBILL_SHOP_ID }}
          CASHBILL_SECRET_KEY: ${{ secrets.CASHBILL_SECRET_KEY }}
        run: vendor/bin/phpunit --testsuite=Integration
        continue-on-error: true
